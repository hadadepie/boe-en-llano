# Actualiza los datos del BOE y (opcionalmente) publica la web en GitHub Pages.
#
# Se ejecuta UNA VEZ POR SEMANA (domingo por la mañana, cuando la edición de
# lunes a sábado ya está completa) y también a mano (Actions → "Run workflow").
# Las ejecuciones programadas solo funcionan desde la rama principal (main).
# Publicar la web en GitHub Pages (necesita un repositorio público o un plan de
# pago, y Settings → Pages → Source: GitHub Actions):
#   - a mano: casilla "publicar" al lanzarlo;
#   - solo la web, sin consultar ninguna fuente (p. ej. tras un cambio de
#     diseño): casilla "solo publicar"; exporta con los datos/ ya guardados;
#   - cada domingo: crea la variable del repositorio PUBLICAR_WEB = true
#     (Settings → Secrets and variables → Actions → Variables). Sin ella, el
#     domingo solo se actualizan los datos.
name: Actualización semanal

on:
  schedule:
    # Domingo 08:00 UTC = 09:00 en Madrid en invierno (10:00 en verano).
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar la web en GitHub Pages"
        type: boolean
        default: false
      solo_publicar:
        description: "Solo publicar la web, sin descargar datos (usa los ya guardados)"
        type: boolean
        default: false

permissions:
  contents: write           # para guardar los datos nuevos en el repositorio
  pages: write              # para publicar en GitHub Pages
  id-token: write

concurrency:
  group: actualizacion-semanal
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Descargar, clasificar, resumir y exportar
        if: ${{ !inputs.solo_publicar }}
        env:
          # Opcional: IA externa configurada como secretos del repositorio.
          # Sin estos secretos todo funciona y las fichas nuevas quedan "pendiente".
          BOE_IA_PROVEEDOR: ${{ secrets.BOE_IA_PROVEEDOR }}
          BOE_IA_MODELO: ${{ secrets.BOE_IA_MODELO }}
          BOE_IA_URL: ${{ secrets.BOE_IA_URL }}
          BOE_IA_CLAVE: ${{ secrets.BOE_IA_CLAVE }}
        run: python -m boe.principal --dias 7   # la semana que acaba

      - name: Exportar la web con los datos ya guardados
        if: ${{ inputs.solo_publicar }}
        run: python -m boe.exportar

      - name: Guardar los datos nuevos en el repositorio
        if: ${{ !inputs.solo_publicar }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then
            echo "No hay datos nuevos."
          else
            git commit -m "Datos del BOE: actualización del $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
        if: ${{ inputs.publicar || inputs.solo_publicar || vars.PUBLICAR_WEB == 'true' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.publicar || inputs.solo_publicar || vars.PUBLICAR_WEB == 'true' }}
        with:
          path: web

  publicar:
    needs: actualizar
    if: ${{ inputs.publicar || inputs.solo_publicar || vars.PUBLICAR_WEB == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
