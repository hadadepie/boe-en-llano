# Actualiza los datos del BOE y (opcionalmente) publica la web en GitHub Pages.
#
# ESTADO EN LA POC: solo se ejecuta a mano (pestaña Actions → "Run workflow").
# Para activar la ejecución diaria, descomenta el bloque `schedule`. GitHub
# Pages necesita un repositorio público (o un plan de pago): marca "publicar"
# solo cuando lo tengas configurado en Settings → Pages → Source: GitHub Actions.
name: Actualización diaria

on:
  # schedule:
  #   # 07:15 UTC = 08:15 en Madrid en invierno (09:15 en verano).
  #   - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar la web en GitHub Pages"
        type: boolean
        default: false

permissions:
  contents: write           # para guardar los datos nuevos en el repositorio
  pages: write              # para publicar en GitHub Pages
  id-token: write

concurrency:
  group: actualizacion-diaria
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Descargar, clasificar, resumir y exportar
        env:
          # Opcional: IA externa configurada como secretos del repositorio.
          # Sin estos secretos todo funciona y las fichas nuevas quedan "pendiente".
          BOE_IA_PROVEEDOR: ${{ secrets.BOE_IA_PROVEEDOR }}
          BOE_IA_MODELO: ${{ secrets.BOE_IA_MODELO }}
          BOE_IA_URL: ${{ secrets.BOE_IA_URL }}
          BOE_IA_CLAVE: ${{ secrets.BOE_IA_CLAVE }}
        run: python -m boe.principal --dias 7

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then
            echo "No hay datos nuevos."
          else
            git commit -m "Datos del BOE: actualización del $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
        if: ${{ inputs.publicar }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.publicar }}
        with:
          path: web

  publicar:
    needs: actualizar
    if: ${{ inputs.publicar }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
